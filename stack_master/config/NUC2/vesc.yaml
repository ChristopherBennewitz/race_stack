/**:
  # general parameters shared by all vesc-related nodes
  ros__parameters:
    # erpm (electrical rpm) = speed_to_erpm_gain * speed (meters / second) + speed_to_erpm_offset
    # Gain measured against SLAM travel on straight runs: 4543. Two derivations (chord
    # ratio, and a joint fit of gain and rest offset over 0.15-5.0 m/s) bracket it at
    # 4509-4585; both exclude the old 4352.
    # The offset is motor deadband on the command path only; see vesc_to_odom_node.
    speed_to_erpm_gain: 4543.0
    speed_to_erpm_offset: 220.0

    # servo value (0 to 1) =  steering_angle_to_servo_gain * steering angle (radians) + steering_angle_to_servo_offset
    # Includes the former x1.3 steering correction from ackermann_mux.
    steering_angle_to_servo_gain: -1.43
    steering_angle_to_servo_offset: 0.505

    port: /dev/sensors/vesc
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 100.0
    brake_min: -20000.0
    brake_max: 200000.0
    speed_min: -69000.0
    speed_max: 69000.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.00
    servo_max: 1.00

ackermann_to_vesc_node:
  ros__parameters:
    ackermann_input_topic: ackermann_cmd_applied
    motor_output_topic: commands/motor/speed
    servo_output_topic: commands/servo/position

actuation_manager:
  ros__parameters:
    # Limits are in controller-facing units: m/s, m/s^2, radians and rad/s.
    speed_min: -5.0
    speed_max: 5.0
    max_acceleration: 5.0
    max_deceleration: 5.0
    steering_min: -0.30
    steering_max: 0.30
    max_steering_rate: 3.0
    output_rate: 100.0
    command_timeout: 0.2
    joy_timeout: 0.2
    human_deadman_button: 4
    autonomous_deadman_button: 5

vesc_driver_node:
  ros__parameters:
    # Stop and centre if either final actuator stream becomes stale.
    command_timeout: 0.2
    # IMU polling period in seconds (0.005 = 200Hz); telemetry stays at 50Hz.
    imu_poll_period: 0.005

vesc_to_odom_node:
  ros__parameters:
    # A stationary motor reports no erpm, so the command-side deadband offset must not be
    # subtracted from a measurement.
    speed_to_erpm_offset: 0.0
    odom_frame: odom
    base_frame: base_link
    # publish odom to base link tf
    publish_tf: false
    use_servo_cmd_to_calc_angular_velocity: true
    # Measured axle-to-axle wheelbase
    wheelbase: .321
